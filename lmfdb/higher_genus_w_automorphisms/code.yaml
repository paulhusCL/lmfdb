# Code appended to the downloads of generating vectors (HGCWA_download.download_vectors in main.py).
# The download first assigns
#   d           the degree of the LMFDB permutation representation of the group
#   gens        its generators, as lists of images
#   vector_data the generating vectors, each a list of permutations given as lists of images
# Products are read from left to right (apply c_1 first) in Magma, GAP and Sage, so c_1 c_2 ... c_r = 1.

group:
  magma: |
    S := Sym(d);
    G := sub<S | [S!g : g in gens]>;
  gap: |
    G := Group(List(gens, PermList));
  sage: |
    S = SymmetricGroup(d)
    G = S.subgroup([S(g) for g in gens])

vectors:
  magma: |
    vectors := [[G!(S!c) : c in v] : v in vector_data];
  gap: |
    vectors := List(vector_data, v -> List(v, PermList));
  sage: |
    vectors = [[G(S(c)) for c in v] for v in vector_data]

check:
  magma: |
    // Each vector generates G and the product of its entries is the identity
    assert forall{v : v in vectors | sub<G | v> eq G and &*v eq Id(G)};
  gap: |
    # Each vector generates G and the product of its entries is the identity
    if not ForAll(vectors, v -> Group(v) = G and Product(v) = ()) then Error("unexpected generating vector"); fi;
  sage: |
    # Each vector generates G and the product of its entries is the identity
    assert all(S.subgroup(v).order() == G.order() and prod(v) == G.one() for v in vectors)
